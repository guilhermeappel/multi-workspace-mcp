name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs of a branch or pull request, but never a publish in progress on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

# Third-party actions are pinned to a commit SHA (the tag is in the comment); Dependabot keeps them current.
jobs:
  branch-name:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pattern documented in docs/development.md: <type>/<kebab-case-description>. Dependabot branches are allowed.
      - name: Validate branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          pattern='^((feature|fix|hotfix|refactor|test|docs|chore)/[a-z0-9]+(-[a-z0-9]+)*|dependabot/.+)$'
          if [[ ! "$HEAD_REF" =~ $pattern ]]; then
            echo "::error::Branch '$HEAD_REF' must match <type>/<kebab-case-description> with type in feature|fix|hotfix|refactor|test|docs|chore."
            exit 1
          fi

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NotionMultiMcp.slnx

      # Formatting, style and naming rules from .editorconfig; fix locally with `dotnet format`.
      - name: Check code style
        run: dotnet format NotionMultiMcp.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build NotionMultiMcp.slnx --no-restore -c Release

      - name: Test
        run: >
          dotnet test NotionMultiMcp.slnx --no-build -c Release
          --collect:"XPlat Code Coverage" --results-directory TestResults
          --logger "console;verbosity=normal"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14

  image:
    name: Docker image
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Pull requests build the image to catch Dockerfile errors, but only a push to main logs in and publishes.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io/<user>/<repo> in lowercase, tags "latest" and "sha-xxxxxxx".
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name == 'push'
        run: |
          {
            echo "### Image published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Deploy: \`az containerapp update -n notion-mcp -g rg-notion-mcp --image ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
