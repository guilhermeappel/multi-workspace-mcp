name: release

# Pushing a tag such as v1.2.3 tests the code, publishes the image with the version tags and creates the
# GitHub release. Deployment stays manual (see docs/deployment.md).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

# Third-party actions are pinned to a commit SHA (the tag is in the comment); Dependabot keeps them current.
jobs:
  verify:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NotionMultiMcp.slnx

      - name: Check code style
        run: dotnet format NotionMultiMcp.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build NotionMultiMcp.slnx --no-restore -c Release

      - name: Test
        run: dotnet test NotionMultiMcp.slnx --no-build -c Release

  publish:
    name: Image and GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io/<user>/<repo> in lowercase. v1.2.3 becomes the tags 1.2.3 and 1.2; a pre-release tag such as
      # v1.2.3-rc.1 only gets its own version tag.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--generate-notes --verify-tag)
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}" --repo "$GITHUB_REPOSITORY"

      - name: Summary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "### Release $TAG"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Deploy: \`az containerapp update -n notion-mcp -g rg-notion-mcp --image ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}\`"
          } >> "$GITHUB_STEP_SUMMARY"
