name: Feature request
description: Suggest a tool, a behaviour or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem you want to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: A new tool, a different behaviour, a documentation change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
